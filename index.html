<style>
:root{
  --bg:#F6F5FF; --surface:#FFFFFF; --surface2:#EFEDFB; --line:#E6E4F4; --text:#11142D; --muted:#5F6586;
  --purple:#6355F0; --purple2:#7A6FFA; --ink:#11142D; --pink:#FF5C8A;
  --ok:#0B7A4B; --okbg:#E4F7EE; --warn:#8A5200; --warnbg:#FFF1D6; --bad:#C0214F; --badbg:#FFE8EC;
  --sans:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow:0 10px 24px rgba(112,101,240,.08);
  --tabbg:#EAE8F8; --g1:#7A6FFA; --g2:#5B4DE0; --barbg:rgba(255,255,255,.94); --ov:rgba(17,20,45,.45); --chipbg:#EFEDFD; --onink:#fff;
}
/* ---- graphics ---- */
.glow{filter:drop-shadow(0 0 3px currentColor)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px}
.bar2{height:8px;border-radius:9999px;background:var(--tabbg);overflow:hidden;margin-top:4px}
.bar2>i{display:block;height:100%;border-radius:9999px}
.bar2.old{height:5px}.bar2.old>i{background:var(--muted);opacity:.55}
.heat{flex:1;display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(12,1fr);gap:3px}
.hlab{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:.6rem;font-weight:800;color:var(--muted);align-items:center}
.hc{display:block;aspect-ratio:1;border-radius:6px;background:var(--tabbg)}
.hc.nil{background:transparent}.hc.hot{box-shadow:0 0 8px var(--purple)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes arcdraw{from{stroke-dashoffset:100}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spinin{from{opacity:0;transform:rotate(-40deg) scale(.88)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  main.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
  main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(5){animation-delay:.16s}main.enter>*:nth-child(n+6){animation-delay:.2s}
  main.enter .arc{animation:arcdraw .9s .1s ease-out both}
  main.enter .reveal{animation:reveal .9s .1s ease-out both}
  main.enter .grow{animation:growup .7s .1s cubic-bezier(.2,.8,.2,1) both}
  main.enter .spin-in svg{animation:spinin .7s cubic-bezier(.2,.8,.2,1) both}
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
[hidden]{display:none!important}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.45;font-size:15px;
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));min-height:100vh}
.app{width:100%;max-width:480px;margin:0 auto;position:relative}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
body.priv .mono{filter:blur(7px)}
.muted{color:var(--muted)}
.s-ok{--st:var(--ok);--stbg:var(--okbg)} .s-warn{--st:var(--warn);--stbg:var(--warnbg)}
.s-bad{--st:var(--bad);--stbg:var(--badbg)} .s-none{--st:var(--muted);--stbg:var(--surface2)}

.top{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .date{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

/* payoff simulation: when a debt clears, its payment rolls into the next one */
function simulate(debts, extra, strategy) {
  const ds = debts.map(d => ({ name: d.name, bal: d.balance, r: (d.apr || 0) / 1200, min: d.minPayment || 0, done: null }));
  if (!ds.length) return { months: 0, interest: 0, ok: true, order: [] };
  const pool = ds.reduce((s, d) => s + d.min, 0) + extra;
  let m = 0, interest = 0;
  while (ds.some(d => d.bal > 0.005) && m < 600) {
    m++;

    let avail = pool;
    ds.forEach(d => { if (d.bal > 0) { const p = Math.min(d.min, d.bal, avail); d.bal -= p; avail -= p; } });
    const open = ds.filter(d => d.bal > 0.005).sort(strategy === 'snowball' ? (a, b) => a.bal - b.bal : (a, b) => b.r - a.r || a.bal - b.bal);

    ds.forEach(d => { if (d.bal <= 0.005 && d.done === null) d.done = m; });
  }
  return { months: m, interest, ok: !ds.some(d => d.bal > 0.005),
    order: ds.filter(d => d.done !== null).sort((a, b) => a.done - b.done).map(d => ({ name: d.name, month: d.done, min: d.min })) };
}

    this.syncBtn(); if (this.msheet) this.refreshMenuSheet();
    if (this.pill) this.setPill(this.pill.text, this.pill.cls);
  }
  body() {
    switch (this.tab) {
      case 'cards': return this.rCards();
      case 'income': return this.rIncome();
      case 'work': return this.rWork();
      case 'spend': return this.rSpend();
      case 'fixed': return this.rFixed();
      case 'review': return this.rReview();
      case 'analytics': return this.rAnalytics();
      case 'debts': return this.rDebts();
      case 'plan': return this.rPlan();
      default: return this.rToday();
    }
  }
  refreshBody() { const b = $('pbody'); if (b) b.innerHTML = this.body(); }
  periodBar() {
    const v = this.view, ms = this.monthsAvail(), idx = Math.max(0, ms.indexOf(v.month)), isM = v.mode === 'month';
    const cur = ymOf(new Date());
    const canNext = isM ? v.month < cur : v.mode === 'day' ? v.from < ld() : false;
    const canPrev = isM || v.mode === 'day';
    return `<div class="period-row">
      <button class="icon-btn flat" aria-label="Previous" ${canPrev ? '' : 'disabled style="opacity:.3"'} onclick="app.shift(-1)">‹</button>
      <div class="period-label" id="plabel">${esc(this.periodLabel())}</div>
      <button class="icon-btn flat" aria-label="Next" ${canNext ? '' : 'disabled style="opacity:.3"'} onclick="app.shift(1)">›</button>
      <button class="icon-btn" aria-label="Calendar" onclick="${this.feat('calendar') ? 'app.calSheet()' : 'app.pickSheet()'}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    </div>
    ${isM && ms.length > 1 ? `<input class="range" type="range" min="0" max="${ms.length - 1}" value="${idx}" aria-label="Drag to choose a month" oninput="app.slide(this.value)"><div class="range-labels"><span>${monthShort(ms[0])}</span><span>${v.mode === 'month' && v.month !== cur ? '<button class="link" onclick="app.resetPeriod()">Back to this month</button>' : 'This month'}</span></div>` : (!isM ? `<div class="range-labels"><span></span><button class="link" onclick="app.resetPeriod()">Back to this month</button></div>` : '')}`;
  }
  slide(i) { const m = this.monthsAvail()[+i]; if (!m) return; this.view = { mode: 'month', month: m, from: '', to: '' }; const l = $('plabel'); if (l) l.textContent = this.periodLabel(); this.refreshBody(); }

  ring(pct, color, size = 64) {
    const r = 26, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct));
    return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" role="img" aria-label="${Math.round(p)} percent paid"><circle cx="32" cy="32" r="${r}" fill="none" stroke="${cv('--tabbg')}" stroke-width="8"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c * p / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="${cv('--text')}">${Math.round(p)}%</text></svg>`;
  }
  paidPct(list) { const o = list.reduce((s, d) => s + (d.originalBalance || 0), 0), b = list.reduce((s, d) => s + Math.max(0, d.balance || 0), 0); return o > 0 ? Math.max(0, (1 - b / o) * 100) : 0; }
  pillHtml(st) { return `<span class="pill ${st.cls}">${st.icon} ${esc(st.label)}</span>`; }
  catIcon(cat, cls) { const col = CAT_COLOR[cat] || '#6355F0'; return `<div class="ico" style="background:${col}22;color:${col}">${svgIcon(cat)}</div>`; }
  cardLabel(c) { return c ? c.name + (c.last4 && c.last4 !== '0000' ? ' ••' + c.last4 : '') : 'Cash'; }

  /* ---------- Today ---------- */
  rToday() {
    const d = this.data, t = this.totals(), liq = this.liquid(), due = this.dueList(), short = this.shortfalls().concat(this.forecastWarn());
    const empty = !d.cards.length && !d.expenses.length && !d.debts.length;
    let h = '';
    if (empty) h += `<div class="card"><h2>Welcome</h2><p class="note">Start in three steps: 1) add your accounts under Cards & Cash, 2) add your debts and bills under Debts, 3) tap the big button below to record spending. Your data stays in your own saved file.</p><div class="btns"><button class="btn purple sm" onclick="app.setTab('cards')">Add accounts</button><button class="btn light sm" onclick="app.setTab('debts')">Add debts</button></div></div>`;
    h += `<div class="hero"><div><div class="lbl">Cash you can use now</div><div class="big mono">${usd(liq)}</div></div>
      <div class="chips"><div class="chip"><div class="l">Earned</div><div class="v mono">${usd(t.earned)}</div><div class="n">Card ${usd(t.earnedCard)}</div><div class="n">Cash ${usd(t.earnedCash)}</div></div><div class="chip"><div class="l">Spent</div><div class="v mono">${usd(t.spent)}</div><div class="n">Card ${usd(t.spentCard)}</div><div class="n">Cash ${usd(t.spentCash)}</div></div><div class="chip"><div class="l">Net</div><div class="v mono">${usd(t.earned - t.spent)}</div><div class="n">Card ${usd(t.earnedCard - t.spentCard)}</div><div class="n">Cash ${usd(t.earnedCash - t.spentCash)}</div></div></div>${t.saved > 0 ? `<div class="lbl" style="margin-top:10px">Saved ${usd(t.saved)} · Left after saving ${usd(t.earned - t.spent - t.saved)}</div>` : ''}</div>`;
    h += this.scoreChipHtml();
    this.swCount = 0;
    if (short.length) h += this.sw('warn', `<div class="alert s-bad"><h2>Money warning</h2>${short.map(s => `<div class="it"><div><div class="t">! ${esc(s)}</div></div></div>`).join('')}</div>`);
    h += this.storageWarnHtml() + this.serverWarnHtml();
    h += this.dataIssuesHtml(true);
    if (this.feat('t_plan')) h += this.sw('plan', this.planCardHtml());
    h += this.insightsHtml();
    if (this.feat('t_sav')) h += this.sw('sav', this.savingsCardHtml());
    if (this.feat('t_india')) h += this.sw('india', this.indiaCardHtml());
    if (this.feat('t_deadline')) h += this.sw('deadline', this.targetCardHtml());
    h += this.sw('pend', this.pendingIncomeHtml());
    if (due.length) {
      h += this.sw('due', `<div class="alert ${due.some(x => x.diff < 0) ? 's-bad' : 's-warn'}"><h2>Needs attention (${due.length})</h2>` + due.map(x => {
        const it = x.item, amt = x.type === 'bill' ? usd(it.amount) : money(it.minPayment || 0, it.currency);
        const when = x.diff < 0 ? `Overdue ${-x.diff} day${x.diff === -1 ? '' : 's'}` : x.diff === 0 ? 'Due today' : 'Due in ' + x.diff + ' days';
        return `<div class="it ${x.diff < 0 ? 's-bad' : 's-warn'}"><div style="min-width:0"><div class="t">${esc(it.name)} <span class="mono">${amt}</span></div><div class="s">${x.diff < 0 ? '! ' : ''}${when} · ${shortDate(ld(x.due))}${x.type === 'debt' ? ' · min payment' : ''}</div></div>
        <div class="btns"><button class="btn dark sm" onclick="app.payDue('${x.type}','${it.id}','${x.key}')">Paid</button><button class="btn light sm" onclick="app.dismissDue('${x.type}','${it.id}','${x.key}')">Skip</button></div></div>`;
      }).join('') + `</div>`);
    } else if (d.bills.length || d.debts.length) h += this.sw('ok', `<div class="alert s-ok"><h2>✓ All caught up</h2><div class="note" style="color:var(--ok)">No bills or payments due in the next ${d.settings.remind} days.</div></div>`);
    // debt rings
    const dU = d.debts.filter(x => x.currency !== 'INR'), dI = d.debts.filter(x => x.currency === 'INR');
    const ccU = d.cards.filter(c => c.type === 'credit' && !c.linkedDebtId).reduce((s, c) => s + Math.max(0, c.balance), 0);
    if (this.feat('t_debts') && (dU.length || dI.length || ccU)) {
      h += `<div class="card"><h2>Debts <button class="link" onclick="app.setTab('debts')">Open</button></h2><div class="rings">
        <div class="ringbox">${this.ring(this.paidPct(dU), '#05C168')}<div><div class="l">USD owed</div><div class="v mono">${usd(this.usdDebtTotal())}</div></div></div>
        ${dI.length ? `<div class="ringbox">${this.ring(this.paidPct(dI), '#FF5C8A')}<div><div class="l">India owed</div><div class="v mono">${inr(this.inrDebtTotal())}</div></div></div>` : ''}</div>
        <div class="note">USD and rupee debts stay separate. Paying a debt turns it green when done.</div></div>`;
    }
    // budgets
    const bw = this.budgetRows(t).filter(r => r.pct >= 80);
    if (bw.length && this.feat('t_budget')) h += `<div class="card"><h2>Budget watch</h2><div class="list">${bw.map(r => `<div class="li ${r.st.cls}"><div class="mid"><div class="t">${esc(r.name)} ${this.pillHtml(r.st)}</div><div class="s mono">${usd(r.spent)} of ${usd(r.budget)}</div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100, r.pct)}%"></i></div></div></div>`).join('')}</div></div>`;
    // goals
    if (d.goals.length && this.feat('t_goals')) h += `<div class="card"><h2>Savings goals <button class="link" onclick="app.setTab('plan')">Open</button></h2><div class="list">${d.goals.map(g => this.goalRow(g, false)).join('')}</div></div>`;
    // recent
    const recent = [...d.expenses].filter(e => this.inPeriod(e.date)).sort((a, b) => b.date.localeCompare(a.date) || (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 5);
    h += `<div class="card"><h2>Latest in ${esc(this.periodLabel())} <button class="link" onclick="app.setTab('spend')">See all</button></h2>${recent.length ? `<div class="list">${recent.map(e => this.expRow(e, false)).join('')}</div>` : '<div class="empty">Nothing recorded in this period.</div>'}</div>`;
    if (this.swCount > 0) h += `<div class="note" style="text-align:center">${this.swCount} card${this.swCount > 1 ? 's' : ''} hidden until tomorrow · <button class="link" onclick="app.swReset()">Show</button></div>`;
    h += `<div class="note" style="text-align:center"><span id="sync-pill" class="pill s-none">${this.pill ? esc(this.pill.text) : ''}</span></div>`;
    return h;
  }
  expRow(e, actions) {
    const st = NONSPEND.includes(e.category) ? 's-none' : '';
    const dest = ['ToSavings', 'FromSavings'].includes(e.category) && (e.linkedDebtId || '').startsWith('card_') ? (this.data.cards.find(c => c.id === e.linkedDebtId.slice(5)) || {}).name : '';
    const fromSv = ((this.data.cards.find(c => c.id === e.cardId) || {}).type === 'savings') && !dest;
    const fromIn = ((this.data.cards.find(c => c.id === e.cardId) || {}).type === 'india') && e.inrAmount != null;
    const onCr = this.onCredit(e), owedCr = onCr ? r2(e.amount - (e.paidBack || 0)) : 0;
    const sib = e.splitId ? this.data.expenses.find(o => o.id !== e.id && o.splitId === e.splitId) : null, spl = sib ? ' · split with ' + esc(sib.cardName || 'Cash') : '';
    const extra = spl + (dest ? ` → ${esc(dest)}` : fromSv ? ' · from savings' : fromIn ? ` · ${usd(e.amount)} counted` : e.inrAmount != null ? (e.category === 'SendIndia' ? ` · ${inr(e.inrAmount)} received` : ` · ${inr(e.inrAmount)} paid`) : '');
    const main = `<div class="main" ${actions ? `onclick="this.parentNode.classList.toggle('open')"` : ''}>${this.catIcon(e.category)}<div class="mid"><div class="t">${esc(e.note || CAT_NAME[e.category] || e.category)}</div><div class="s">${shortDate(e.date)} · ${esc(CAT_NAME[e.category] || e.category)} · ${esc(e.cardName || 'Cash')}${extra}${e.repaid ? ' · repaid ✓' : ''}${onCr ? (owedCr > 0.004 ? ` · <b>on credit, ${usd(owedCr)} unpaid</b>` : ' · paid back ✓') : ''}</div></div><div class="mono">-${fromIn ? inr(e.inrAmount) : usd(e.amount)}</div></div>`;
    if (!actions) return `<div class="li ${st}" style="padding:0">${main}</div>`;
    return `<div class="srow">${main}<div class="acts">${onCr && owedCr > 0.004 ? `<button class="btn dark sm" onclick="app.payBackSheet('${e.id}')">Paid</button>` : ''}${e.category === 'Lent' && !e.repaid ? `<button class="btn light sm" onclick="app.repaySheet('${e.id}')">Got it back</button>` : ''}<button class="btn light sm" onclick="app.expenseSheet({id:'${e.id}'})">Edit</button><button class="btn danger sm" onclick="app.delAsk('expenses','${e.id}')">Delete</button></div></div>`;
  }
  budgetRows(t) {
    return BUDGET_CATS.filter(c => this.data.budgets[c] > 0).map(c => {
      const budget = this.data.budgets[c], spent = t.byCat[c] || 0, pct = spent / budget * 100;
      const st = pct >= 100 ? { cls: 's-bad', label: 'Over budget', icon: '!' } : pct >= 80 ? { cls: 's-warn', label: Math.round(pct) + '% used', icon: '!' } : { cls: 's-ok', label: Math.round(pct) + '% used', icon: '✓' };
      return { name: CAT_NAME[c], cat: c, budget, spent, pct, st };
    });
  }
  goalRow(g, actions) {
    const p = g.target > 0 ? Math.min(100, g.saved / g.target * 100) : 0, st = p >= 100 ? 's-ok' : 's-none';
    return `<div class="li ${st}" style="align-items:flex-start"><div class="mid"><div class="t">${esc(g.name)} ${p >= 100 ? '<span class="pill s-ok">✓ Reached</span>' : ''}</div><div class="s mono">${usd(g.saved)} of ${usd(g.target)} · ${Math.round(p)}%</div><div class="bar" style="margin-top:6px;--st:var(--ok)"><i style="width:${p}%"></i></div></div>${actions ? `<div class="btns"><button class="btn light sm" onclick="app.goalSheet('${g.id}')">Edit</button><button class="btn purple sm" onclick="app.addSavings('${g.id}')">+ Add</button></div>` : ''}</div>`;
  }

  /* ---------- Cards & Cash ---------- */
  rCards() {
    const d = this.data; let h = `<button class="btn purple wide" onclick="app.cardSheet()">+ Add account / card</button>`;
    if (!d.cards.length) return h + '<div class="card"><div class="empty">No accounts yet. Add your debit card, cash, or credit cards to track balances.</div></div>';
    h += d.cards.map(c => {
      const st = this.acctStatus(c), cr = c.type === 'credit', ind = c.type === 'india', fm = v => ind ? inr(v) : usd(v);
      const lim = cr ? c.creditLimit : c.lowLimit;
      const pct = cr && c.creditLimit ? Math.min(100, c.balance / c.creditLimit * 100) : 0;
      return `<div class="acct ${c.type} ${st.cls}"><div class="row"><div><div class="nm">${esc(c.name)}</div><div class="sub">${cr ? 'Credit card' : ind ? 'India account (₹)' : c.type === 'savings' ? 'Savings account' : c.type === 'cash' ? 'Cash' : 'Debit / bank'}${c.last4 && c.last4 !== '0000' ? ' ••' + esc(c.last4) : ''}</div></div><span class="pill solid ${st.cls}">${st.icon} ${esc(st.label)}</span></div>
        <div><div class="sub">${cr ? 'Owed' : 'Balance'}</div><div class="bal mono">${fm(c.balance)}</div>${ind && this.data.settings.rate > 0 ? `<div class="sub">about ${usd(c.balance / this.data.settings.rate)} at ₹${this.data.settings.rate} per $1</div>` : ''}</div>
        ${cr && c.creditLimit ? `${this.gauge(pct, 'of your limit used')}<div class="sub">${usd(Math.max(0, c.creditLimit - c.balance))} available of ${usd(c.creditLimit)}</div>` : ''}
        ${!(cr && c.creditLimit) ? this.spark(c) : ''}
        ${!cr && c.lowLimit ? `<div class="sub">Low-balance limit ${fm(c.lowLimit)}</div>` : ''}
        <div class="acts"><button class="link" onclick="app.cardSheet('${c.id}')">Edit</button><button class="link" onclick="app.delCard('${c.id}')">Delete</button></div></div>`;
    }).join('');
    h += `<div class="note" style="text-align:center">Colors: green healthy · amber getting tight · red needs action. Debit cards also turn red when cash on hand cannot cover bills due in 7 days.</div>`;
    return h;
  }

  /* ---------- Income ---------- */
  rIncome() {
    const list = this.data.income.filter(i => this.inPeriod(i.date)).sort((a, b) => b.date.localeCompare(a.date));
    const tot = list.reduce((s, i) => s + i.amount, 0), isCash = i => { const c = this.data.cards.find(x => x.id === i.targetCardId); return !c || c.type === 'cash'; };
    const cashT = list.filter(isCash).reduce((s, i) => s + i.amount, 0);
    let h = `<button class="btn purple wide" onclick="app.incomeSheet()">+ Add income</button>${this.feat('payplan') ? '<button class="btn light wide" onclick="app.planSheet()">Plan this paycheck</button>' : ''}${this.recCard()}<div class="card"><h2>Earned <span class="mono" style="color:var(--ok)">${usd(tot)}</span></h2><div class="note">Card ${usd(tot - cashT)} · Cash ${usd(cashT)}</div>`;
    if (!list.length) return h + '<div class="empty">No income in this period.</div></div>';
    let last = '';
    h += '<div class="list">' + list.map(i => {
      const dh = i.date !== last ? `<div class="day">${longDate(i.date)}</div>` : ''; last = i.date;
      const c = this.data.cards.find(x => x.id === i.targetCardId);
      return dh + `<div class="srow"><div class="main" onclick="this.parentNode.classList.toggle('open')"><div class="ico" style="background:var(--okbg);color:var(--ok)">${svgIcon('Income')}</div><div class="mid"><div class="t">${esc(i.source || 'Income')}</div><div class="s">${esc(c ? this.cardLabel(c) : 'No account')}${c && c.type === 'cash' ? '' : isCash(i) ? ' · Cash' : ' · Card'}</div></div><div class="mono" style="color:var(--ok)">+${usd(i.amount)}</div></div><div class="acts"><button class="btn light sm" onclick="app.incomeSheet('${i.id}')">Edit</button><button class="btn danger sm" onclick="app.delAsk('income','${i.id}')">Delete</button></div></div>`;
    }).join('') + '</div></div>';
    return h;
  }

  /* ---------- Spend ---------- */
  donut(byCat, total) {
    const ents = Object.entries(byCat).sort((a, b) => b[1] - a[1]); if (!ents.length || total <= 0) return '';
    const r = 54, c = 2 * Math.PI * r; let off = 0;
    const segs = ents.map(([k, v]) => { const len = v / total * c, s = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${CAT_COLOR[k] || '#9AA0C3'}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`; off += len; return s; }).join('');
    return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Spending by category">${segs}<text x="70" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="${cv('--muted')}">Spent</text><text x="70" y="84" text-anchor="middle" font-size="14" font-weight="800" fill="${cv('--text')}" class="mono">${usd(total).replace(/\.00$/, '')}</text></svg>
      <div style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:6px">${ents.slice(0, 6).map(([k, v]) => `<div style="display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700"><i style="width:10px;height:10px;border-radius:50%;background:${CAT_COLOR[k] || '#9AA0C3'};flex:none"></i><span style="flex:1">${esc(CAT_NAME[k] || k)}</span><span class="mono">${Math.round(v / total * 100)}%</span></div>`).join('')}</div></div>`;
  }
  rSpend() {
    const t = this.totals();
    return `<div class="card"><h2>Spent <span class="mono">${usd(t.spent)}</span></h2>${this.donut(t.byCat, t.spent) || '<div class="empty">No spending in this period.</div>'}</div>
      <div class="card"><div style="display:flex;gap:8px"><input type="search" id="q" placeholder="Search notes, category, card or amount" aria-label="Search spending" value="${esc(this.q)}" oninput="app.search(this.value)"></div><div id="spend-list">${this.spendList()}</div></div>`;
  }
  search(v) { this.q = v; this.spendCap = 200; const l = $('spend-list'); if (l) l.innerHTML = this.spendList(); }
  spendList() {
    const q = this.q.trim().toLowerCase(), aq = q.replace(/[$,\s]/g, ''), isAmt = /^\d+(\.\d{1,2})?$/.test(aq);
    const amtHit = v => v != null && isFinite(v) && (aq.includes('.') ? v.toFixed(2).startsWith(aq) || v.toFixed(2) === (+aq).toFixed(2) : Math.trunc(v) === +aq);
    let list = this.data.expenses.filter(e => isAmt ? true : this.inPeriod(e.date));
    if (q) list = list.filter(e => [e.note, e.category, CAT_NAME[e.category], e.cardName].join(' ').toLowerCase().includes(q) || (isAmt && (amtHit(e.amount) || amtHit(e.inrAmount))));
    else list = list.filter(e => this.inPeriod(e.date));
    list.sort((a, b) => b.date.localeCompare(a.date) || (b.updatedAt || 0) - (a.updatedAt || 0));
    if (!list.length) return '<div class="empty">' + (q ? 'No match.' : 'No entries.') + '</div>';
    let last = '';
    const note = isAmt ? '<div class="note">Showing matches from all dates.</div>' : '', cap = this.spendCap || 200, rest = list.length - cap;
    if (rest > 0) list = list.slice(0, cap);
    return note + '<div class="list">' + list.map(e => { const dh = e.date !== last ? `<div class="day">${longDate(e.date)}</div>` : ''; last = e.date; return dh + this.expRow(e, true); }).join('') + '</div>' + (rest > 0 ? `<button class="btn light wide" onclick="app.moreSpend()">Show more (${rest} left)</button>` : '');
  }
  moreSpend() { this.spendCap = (this.spendCap || 200) + 200; const l = $('spend-list'); if (l) l.innerHTML = this.spendList(); }

  /* ---------- Analytics ---------- */
  rAnalytics() {
    const t = this.totals(), ents = Object.entries(t.byCat).sort((a, b) => b[1] - a[1]), max = ents.length ? ents[0][1] : 1;
    let h = `<div class="tiles"><div class="card soft"><div class="note">Earned</div><div class="mono" style="color:var(--ok)">${usd(t.earned)}</div></div><div class="card soft"><div class="note">Spent</div><div class="mono">${usd(t.spent)}</div></div><div class="card soft"><div class="note">Net</div><div class="mono" style="color:${t.earned - t.spent < 0 ? 'var(--bad)' : 'var(--ok)'}">${usd(t.earned - t.spent)}</div></div><div class="card soft"><div class="note">Paid toward debt</div><div class="mono">${usd(t.debtPaid)}</div></div></div>`;
    h += `<div class="card"><h2>By category</h2>${ents.length ? ents.map(([k, v]) => `<div><div style="display:flex;justify-content:space-between;font-size:.84rem;font-weight:700"><span>${esc(CAT_NAME[k] || k)}</span><span class="mono">${usd(v)}</span></div><div class="bar"><i style="width:${v / max * 100}%;background:${CAT_COLOR[k] || '#9AA0C3'}"></i></div></div>`).join('') : '<div class="empty">No spending in this period.</div>'}</div>`;
    h = this.scoreCardHtml() + h;
    h += this.analyticsExtras(t);
    const br = this.budgetRows(t);
    h += `<div class="card"><h2>Budgets <button class="link" onclick="app.budgetSheet()">Set budgets</button></h2>${br.length ? br.map(r => `<div class="${r.st.cls}"><div style="display:flex;justify-content:space-between;font-size:.84rem;font-weight:700"><span>${esc(r.name)} ${this.pillHtml(r.st)}</span><span class="mono">${usd(r.spent)} / ${usd(r.budget)}</span></div><div class="bar"><i style="width:${Math.min(100, r.pct)}%"></i></div></div>`).join('') : '<div class="empty">Set a monthly budget per category to get warnings. Budgets compare against the period shown.</div>'}</div>`;
    // 6 month trend
    const cur = ymOf(new Date()), months = []; for (let i = 5; i >= 0; i--) months.push(addMonths(cur, -i));
    const sp = months.map(m => this.data.expenses.filter(e => e.date.startsWith(m) && !NONSPEND.includes(e.category)).reduce((s, e) => s + e.amount, 0));
    const inc = months.map(m => this.data.income.filter(e => e.date.startsWith(m)).reduce((s, e) => s + e.amount, 0));
    const mx = Math.max(1, ...sp, ...inc);
    h += this.trend6(months, inc, sp);
    const cards = Object.entries(t.byCard).sort((a, b) => b[1] - a[1]);
    if (cards.length) h += `<div class="card"><h2>By card</h2><div class="list">${cards.map(([k, v]) => `<div class="li"><div class="mid"><div class="t">${esc(k)}</div></div><div class="mono">${usd(v)}</div></div>`).join('')}</div></div>`;
    h += `<button class="btn light wide" onclick="app.exportCSV()">Download this period as CSV</button>`;
    return h;
  }

  /* ---------- Fixed monthly bills ---------- */
  fixedStatus(it, isDebt) {
    const cur = ymOf(new Date()), t0 = sod(new Date());
    const kd = isDebt ? 'debt' : 'bill'; let nm = addMonths(cur, 1), early = null, g = 0;
    while (g++ < 12 && this.monthPaid(kd, it, nm)) { if (!early) early = nm; nm = addMonths(nm, 1); }
    const [ny, nmo] = nm.split('-').map(Number), earlyTxt = early ? ' · ' + monthShort(early).slice(0, 3) + ' paid ✓' : '';
    const nextTxt = earlyTxt + ' · next ' + shortDate(ld(new Date(ny, nmo - 1, Math.min(it.dueDay || 1, new Date(ny, nmo, 0).getDate()))));
    const planned = isDebt ? it.minPayment || 0 : it.amount || 0, cu = isDebt ? it.currency : 'USD', paidSoFar = this.paidFor(isDebt ? 'debt' : 'bill', it.id, cur);
    if ((it.skippedMonths || []).includes(cur)) return { cls: 's-none', label: 'Skipped' + nextTxt, icon: '•', paid: true, skipped: true };
    if ((it.paidMonths || []).includes(cur) || (isDebt ? planned > 0 && paidSoFar >= planned - 0.005 : paidSoFar > 0.005)) return { cls: 's-ok', label: 'Paid' + nextTxt, icon: '✓', paid: true };
    if ((it.dismissedMonths || []).includes(cur)) return { cls: 's-ok', label: 'Done' + nextTxt, icon: '✓', paid: true };
    if (paidSoFar > 0.005) { const left = r2(planned - paidSoFar); return { cls: 's-warn', label: 'Paid ' + money(paidSoFar, cu) + ' · ' + money(left, cu) + ' left', icon: '!', partial: true, left }; }
    if (it.flex) return { cls: 's-none', label: 'Pay any day this month', icon: '•' };
    const [y, m] = cur.split('-').map(Number), dim = new Date(y, m, 0).getDate();
    const due = new Date(y, m - 1, Math.min(it.dueDay || 1, dim)), diff = Math.round((due - t0) / 864e5);
    if (it.created === cur && it.createdDate && ld(due) < it.createdDate) return early ? { cls: 's-ok', label: 'Paid' + nextTxt, icon: '✓', paid: true } : { cls: 's-none', label: 'Next: ' + shortDate(ld(new Date(y, m, Math.min(it.dueDay || 1, new Date(y, m + 1, 0).getDate())))), icon: '•', paid: true };
    if (diff < 0) return { cls: 's-bad', label: 'Overdue ' + (-diff) + 'd', icon: '!', diff };
    if (diff <= 7) return { cls: 's-warn', label: diff === 0 ? 'Due today' : 'Due in ' + diff + 'd', icon: '!', diff };
    return { cls: 's-none', label: 'Due ' + shortDate(ld(due)), icon: '•', diff };
  }
  rFixed() {
    const d = this.data, cur = ymOf(new Date());
    const bills = d.bills.slice().sort((a, b) => (a.dueDay || 0) - (b.dueDay || 0));
    const loans = d.debts.filter(x => x.balance > 0.005 && x.minPayment > 0).sort((a, b) => (a.dueDay || 0) - (b.dueDay || 0));
    const loansU = loans.filter(x => x.currency !== 'INR'), loansI = loans.filter(x => x.currency === 'INR');
    const sum = (list, f) => list.reduce((s, x) => s + f(x), 0);
    const totU = sum(bills, b => b.amount) + sum(loansU, x => x.minPayment);
    const rem = (it, isD) => { const st = this.fixedStatus(it, isD); return st.paid ? 0 : st.partial ? st.left : (isD ? it.minPayment : it.amount) || 0; };
    const leftU = sum(bills, b => rem(b, false)) + sum(loansU, x => rem(x, true));
    const paidU = totU - leftU, liq = this.liquid(), after = liq - leftU;
    const earned = d.income.filter(i => i.date.startsWith(cur)).reduce((s, i) => s + i.amount, 0);
    let h = `<button class="btn purple wide" onclick="app.billSheet()">+ Add fixed monthly expense</button>`;
    h += `<div class="hero"><div><div class="lbl">Fixed expenses every month</div><div class="big mono">${usd(totU)}</div></div>
      <div class="chips"><div class="chip"><div class="l">Done this month</div><div class="v mono">${usd(paidU)}</div></div><div class="chip"><div class="l">Still to pay</div><div class="v mono">${usd(leftU)}</div></div><div class="chip"><div class="l">Cash after</div><div class="v mono">${usd(after)}</div></div></div></div>`;
    if (after < 0) h += `<div class="alert s-bad"><h2>! Short by ${usd(-after)}</h2><div class="note" style="color:var(--bad)">Cash on hand cannot cover the fixed bills still to pay this month.</div></div>`;
    if (earned > 0 && totU > 0) h += `<div class="note" style="text-align:center">Fixed expenses are ${Math.round(totU / earned * 100)}% of the ${usd(earned)} you earned this month.</div>`;
    const row = (it, isDebt) => {
      const st = this.fixedStatus(it, isDebt), amt = isDebt ? money(it.minPayment, it.currency) : usd(it.amount);
      const kind = isDebt ? 'Loan' : it.kind || 'Bill';
      const nk = addMonths(cur, 1), nx = this.paidFor(isDebt ? 'debt' : 'bill', it.id, nk), pl = isDebt ? it.minPayment || 0 : it.amount || 0, cu2 = isDebt ? it.currency : 'USD';
      const nxTxt = nx > 0.005 && !this.monthPaid(isDebt ? 'debt' : 'bill', it, nk) ? ' · ' + monthShort(nk).slice(0, 3) + ': ' + (isDebt && pl - nx > 0.005 ? money(nx, cu2) + ' paid, ' + money(pl - nx, cu2) + ' left' : money(nx, cu2) + ' paid ✓') : '';
      const dup = isDebt ? null : loans.find(x => x.currency !== 'INR' && Math.abs((x.minPayment || 0) - (it.amount || 0)) < 0.01);
      const dupNote = dup ? `<div class="s" style="color:var(--bad);font-weight:700">! Same amount as your loan "${esc(dup.name)}" below. Counted twice? Tap Delete to keep just one.</div>` : '';
      return `<div class="srow ${st.cls}${dup ? ' open' : ''}"><div class="main" onclick="this.parentNode.classList.toggle('open')"><div class="stripe"></div><div class="mid"><div class="t">${esc(it.name)}</div><div class="s">${esc(kind)} · day ${it.dueDay || '-'} · ${this.pillHtml(st)}${nxTxt}</div>${dupNote}</div><div class="mono">${amt}</div></div>
        <div class="acts">${this.dueBtns(isDebt ? 'debt' : 'bill', it, st)}<button class="btn light sm" onclick="app.${isDebt ? 'debtSheet' : 'billSheet'}('${it.id}')">Edit</button>${isDebt ? '' : `<button class="btn danger sm" onclick="app.del('bills','${it.id}')">Delete</button>`}</div></div>`;
    };
    h += `<div class="card"><h2>Bills</h2>${bills.length ? '<div class="list">' + bills.map(b => row(b, false)).join('') + '</div>' : '<div class="empty">Add rent, car insurance, phone and other fixed monthly expenses. Tap a row to mark it paid or edit it.</div>'}</div>`;
    if (loans.length) h += `<div class="card"><h2>Loan payments <span class="note">from Debts</span></h2><div class="list">${loans.map(x => row(x, true)).join('')}</div>${loansI.length ? `<div class="note">₹ loans are shown in rupees and not added to the dollar total: ${inr(sum(loansI, x => x.minPayment))} a month.</div>` : ''}</div>`;
    h += `<div class="note" style="text-align:center">Tap any row to see Paid, Skip, Edit and Delete. Loans come from Debts, so do not add them as a bill too. Each bill shows on Today before it is due. Paying it records an expense and takes the money from the account you choose.</div>`;
    return h;
  }

  /* ---------- Debts ---------- */
  rDebts() {
    const v = this.debtView, seg = [['debts', 'Debts'], ['plan', 'Targets'], ['bills', 'Bills'], ['payoff', 'Payoff'], ['lent', 'Lent']];
    let h = `<div class="seg" role="tablist">${seg.map(([k, n]) => `<button class="${v === k ? 'on' : ''}" onclick="app.debtView='${k}';app.renderAll()">${n}</button>`).join('')}</div>`;
    if (v === 'plan') return h + this.rTargets();
    if (v === 'bills') return h + this.rBills();
    if (v === 'payoff') return h + this.debtFreeCard() + this.rPayoff();
    if (v === 'lent') return h + this.rLent();
    const d = this.data;
    h += this.debtFreeCard();
    h += `<button class="btn purple wide" onclick="app.debtSheet()">+ Add debt / loan</button>`;
    h += `<div class="tiles"><div class="card soft"><div class="note">Total owed (USD)</div><div class="mono">${usd(this.usdDebtTotal())}</div></div><div class="card soft"><div class="note">Total owed (₹)</div><div class="mono">${inr(this.inrDebtTotal())}</div></div></div>`;
    if (!d.debts.length) return h + '<div class="card"><div class="empty">No debts added yet.</div></div>';
    const dcard = x => {
      const st = x.balance <= 0.005 ? { cls: 's-ok', label: 'Paid off', icon: '✓' } : this.dueStatusFor('debt', x), p = x.originalBalance > 0 ? Math.max(0, (1 - x.balance / x.originalBalance) * 100) : 0;
      return `<div class="card ${st.cls}" style="border-left:6px solid var(--st)"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><div class="t" style="font-weight:800">${esc(x.name)} ${x.currency === 'INR' ? '<span class="pill s-none">₹ India</span>' : ''}</div><div class="note">${x.apr || 0}% APR · min ${money(x.minPayment || 0, x.currency)} · due day ${x.dueDay || '-'}${x.promoEnd ? ' · 0% until ' + shortDate(x.promoEnd) : x.payoffBy ? ' · pay off by ' + shortDate(x.payoffBy) : ''}</div></div>${this.pillHtml(st)}</div>
        <div class="mono" style="font-size:1.4rem">${money(x.balance, x.currency)}</div><div class="bar" style="--st:var(--ok)"><i style="width:${p}%"></i></div><div class="note">${Math.round(p)}% paid of ${money(x.originalBalance, x.currency)}</div>
        <div class="btns" style="justify-content:flex-end">${x.balance > 0.005 ? this.dueBtns('debt', x, this.fixedStatus(x, true)) : ''}<button class="btn light sm" onclick="app.debtSheet('${x.id}')">Edit</button><button class="btn light sm" onclick="app.delDebt('${x.id}')">Delete</button></div></div>`;
    };
    h += d.debts.filter(x => x.balance > 0.005).map(dcard).join('');
    const cleared = d.debts.filter(x => x.balance <= 0.005);
    if (cleared.length) h += `<details class="card"><summary style="font-weight:800;cursor:pointer">Paid off (${cleared.length})</summary><div class="list" style="margin-top:10px">${cleared.map(x => { const last = d.expenses.filter(e => e.linkedDebtId === 'debt_' + x.id).map(e => e.date).sort().pop(); return `<div class="li s-ok"><div class="mid"><div class="t">✓ ${esc(x.name)}</div><div class="s">Paid off · was ${money(x.originalBalance, x.currency)}${last ? ' · last payment ' + shortDate(last) : ''}</div></div><button class="btn light sm" onclick="app.delDebt('${x.id}')">Delete</button></div>`; }).join('')}</div></details>`;
    return h;
  }
  rBills() {
    const b = this.data.bills; let h = `<button class="btn purple wide" onclick="app.billSheet()">+ Add monthly bill</button>`;
    if (!b.length) return h + '<div class="card"><div class="empty">Add rent, phone, insurance and other monthly bills so they show up on Today before they are due.</div></div>';
    h += `<div class="card"><div class="list">` + b.map(x => { const st = this.dueStatusFor('bill', x); return `<div class="srow ${st.cls}"><div class="main" onclick="this.parentNode.classList.toggle('open')"><div class="stripe"></div><div class="mid"><div class="t">${esc(x.name)}</div><div class="s">Due day ${x.dueDay} each month ${this.pillHtml(st)}</div></div><div class="mono">${usd(x.amount)}</div></div><div class="acts">${this.dueBtns('bill', x, this.fixedStatus(x, false))}<button class="btn light sm" onclick="app.billSheet('${x.id}')">Edit</button><button class="btn danger sm" onclick="app.del('bills','${x.id}')">Delete</button></div></div>`; }).join('') + `</div></div>`;
    return h;
  }
  rLent() {
    const l = this.data.expenses.filter(e => e.category === 'Lent').sort((a, b) => b.date.localeCompare(a.date)), out = l.filter(e => !e.repaid).reduce((s, e) => s + e.amount, 0);
    return `<div class="card"><h2>Friends owe you <span class="mono">${usd(out)}</span></h2>${l.length ? '<div class="list">' + l.map(e => this.expRow(e, true)).join('') + '</div>' : '<div class="empty">Record money you lend with category "Lent to Friend". It is not counted as spending and shows here until it comes back.</div>'}</div>`;
  }
  rPayoff() {
    const d = this.data, s = d.settings;
    const mk = (cur, extra) => {
      const list = d.debts.filter(x => (cur === 'INR') === (x.currency === 'INR') && x.balance > 0.005);
      if (!list.length) return `<div class="empty">No ${cur === 'INR' ? 'rupee' : 'dollar'} debts to plan.</div>`;
      const base = simulate(list, 0, s.strategy), plan = simulate(list, extra, s.strategy), f = v => money(v, cur);
      const mins = list.reduce((a, x) => a + (x.minPayment || 0), 0);
      const noMin = mins <= 0 && extra <= 0;
      if (noMin) return '<div class="empty">Add minimum payments to your debts to see a plan.</div>';
      return `<div class="tiles"><div class="card soft"><div class="note">Debt-free in</div><div class="mono">${plan.ok ? span(plan.months) : '50+ yr'}</div><div class="note">${plan.ok ? monthsFromNow(plan.months) : 'payments too small'}</div></div><div class="card soft"><div class="note">Total interest</div><div class="mono">${f(plan.interest)}</div>${extra > 0 && base.ok && plan.ok ? `<div class="note" style="color:var(--ok)">Saves ${f(base.interest - plan.interest)} and ${span(base.months - plan.months)}</div>` : ''}</div></div>
        <div class="list">${plan.order.map((o, i) => `<div class="li"><div class="ico" style="background:var(--chipbg);color:var(--purple);font-weight:800">${i + 1}</div><div class="mid"><div class="t">${esc(o.name)}</div><div class="s">Cleared ${monthsFromNow(o.month)}</div></div></div>`).join('')}</div>`;
    };
    const save = s.saveDay > 0 ? s.saveDay * 30 : 0;
    return `<div class="card"><h2>Payoff planner</h2><div class="seg"><button class="${s.strategy === 'avalanche' ? 'on' : ''}" onclick="app.setSetting('strategy','avalanche')">Avalanche (highest rate)</button><button class="${s.strategy === 'snowball' ? 'on' : ''}" onclick="app.setSetting('strategy','snowball')">Snowball (smallest)</button></div>
      <div class="two"><label class="f">Extra $ per month<input type="number" inputmode="decimal" min="0" value="${s.extraUsd || ''}" placeholder="0" onchange="app.setSetting('extraUsd',num(this.value))"></label><label class="f">Extra ₹ per month<input type="number" inputmode="decimal" min="0" value="${s.extraInr || ''}" placeholder="0" onchange="app.setSetting('extraInr',num(this.value))"></label></div>
      <label class="f">What if I save $ per day?<input type="number" inputmode="decimal" min="0" value="${s.saveDay || ''}" placeholder="e.g. 5" onchange="app.setSetting('saveDay',num(this.value))"><span class="hint">${save > 0 ? `That is about ${usd(save)} a month. It is added to the dollar plan below.` : 'Try 5 or 10 to see how fast things change.'}</span></label></div>
      <div class="card"><h2>Dollar debts</h2>${mk('USD', (s.extraUsd || 0) + save)}</div>
      <div class="card"><h2>Rupee debts (₹)</h2>${mk('INR', s.extraInr || 0)}</div>
      <div class="note">Estimates use each debt's APR and minimum payment. When one debt is cleared, its payment rolls into the next.</div>`;
  }

  /* ---------- Plan & Backup ---------- */
  themeList() { return [['auto', 'Auto', 'linear-gradient(135deg,#F6F5FF 50%,#0E0F1E 50%)'], ['violet', 'Violet', 'linear-gradient(135deg,#7A6FFA,#5B4DE0)'], ['midnight', 'Midnight', 'linear-gradient(135deg,#222440,#6A5CF5)'], ['black', 'Black', 'linear-gradient(135deg,#000,#4B3FD0)'], ['emerald', 'Emerald', 'linear-gradient(135deg,#18B882,#0A7A52)'], ['ocean', 'Ocean', 'linear-gradient(135deg,#4C8DF5,#1553B8)'], ['sunset', 'Sunset', 'linear-gradient(135deg,#FF7A4D,#C93A1A)'], ['rose', 'Rose', 'linear-gradient(135deg,#F06595,#B02454)'], ['mono', 'Mono', 'linear-gradient(135deg,#4A4A52,#18181B)'], ['neon', 'Neon Grid', 'linear-gradient(135deg,#00E5FF,#B517FF)'], ['aurora', 'Aurora Glass', 'linear-gradient(135deg,#7C3AED,#06B6D4 55%,#F472B6)'], ['holo', 'Hologram', 'linear-gradient(135deg,#7CF5FF,#C79BFF 50%,#FFA8E0)'], ['neonday', 'Neon Day', 'linear-gradient(135deg,#00B8D9,#7A3CFF)'], ['frost', 'Frost Glass', 'linear-gradient(135deg,#A78BFA,#7DD3FC 55%,#FBA8D0)'], ['pearl', 'Pearl Holo', 'linear-gradient(135deg,#5FC4F8,#A68BF5 50%,#F9C97A)']]; }

      <div class="card"><h2>Money tools</h2><div class="btns" style="flex-wrap:wrap"><button class="btn dark sm" onclick="app.affordSheet()">Can I afford this?</button><button class="btn light sm" onclick="app.summarySheet()">Monthly summary</button>${this.feat('emergency') ? '<button class="btn light sm" onclick="app.emergencySheet()">Emergency fund</button>' : ''}${this.feat('askai') ? '<button class="btn light sm" onclick="app.askAiSheet()">Ask AI</button>' : ''}</div><div class="note">The summary has no card numbers or passwords. You choose where to paste it.</div></div>

  dataIssues() {
    const d = this.data, out = [], gen = new Set(['card', 'credit', 'the', 'my', 'loan', 'account', 'bank', 'of', 'america', 'usd']), tok = t => String(t || '').toLowerCase().split(/[^a-z0-9]+/).filter(w => w && !gen.has(w) && !/^\d+$/.test(w));

    d.cards.filter(c => c.type === 'credit').forEach(c => {
      const ld = c.linkedDebtId ? d.debts.find(x => x.id === c.linkedDebtId) : null;
      if (ld) { if (Math.abs((c.balance || 0) - (ld.balance || 0)) > 0.009) out.push({ c: c.id, opts: [ld.id], linked: true, msg: `${c.name} shows ${usd(c.balance)} but its linked debt "${ld.name}" shows ${usd(ld.balance)}.` }); return; }
      if (skip.includes(c.id)) return;
      const ct = tok(c.name), free = d.debts.filter(x => x.currency !== 'INR' && !d.cards.some(k => k.linkedDebtId === x.id));
      if (!free.length) return;
      const score = x => (c.last4 && String(x.name).includes(c.last4) ? 5 : 0) + tok(x.name).filter(w => ct.includes(w)).length, opts = free.slice().sort((a, b) => score(b) - score(a)).map(x => x.id);
      if (!(c.balance > 0) && score(free.find(x => x.id === opts[0])) === 0) return;
      out.push({ c: c.id, opts, linked: false, msg: `${c.name} (${usd(c.balance)}) is not linked to any debt. If you also entered it under Debts, both are counted in "USD owed" and payments only reach one of them.` });
    });
    const nm2 = t => String(t || '').toLowerCase();
    d.debts.filter(x => x.currency !== 'INR' && !d.cards.some(k => k.linkedDebtId === x.id) && !(d.settings.noCard || []).includes(x.id) && !out.some(o => !o.debt && !o.linked && o.opts.includes(x.id)) && (/card|credit|visa|master|amex|discover|chase|bofa/.test(nm2(x.name)))).forEach(x => {
      const cards = d.cards.filter(c => c.type === 'credit'); if (!cards.length) return;
      const score = c => tok(x.name).filter(w => tok(c.name).includes(w)).length, opts = cards.slice().sort((a, b) => score(b) - score(a)).map(c => c.id);
      out.push({ debt: true, dId: x.id, opts, linked: false, msg: `The debt "${x.name}" (${usd(x.balance)}) is not linked to a card. If it is one of your credit cards, link it so payments update both and "USD owed" is not counted twice.` });
    });
    return out;
  }

  /* ================= Health score ================= */
  healthScoreAt(end) {
    const d = this.data, from = addDays(end, -29), inW = x => x >= from && x <= end;
    const inc = d.income.filter(i => inW(i.date)).reduce((a, i) => a + i.amount, 0);
    let spend = 0, debtPaid = 0; const byCat = {};
    d.expenses.filter(e => inW(e.date)).forEach(e => {
      if (e.category === 'Debts') debtPaid += e.amount;
      if (NONSPEND.includes(e.category) || e.category === 'Debts') return;
      spend += e.amount; byCat[e.category] = (byCat[e.category] || 0) + e.amount;
    });
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), parts = [];
    if (inc > 0) {
      const rate = (inc - spend) / inc;
      parts.push({ k: 'Savings rate', max: 25, pts: clamp(rate / 0.20, 0, 1) * 25, val: Math.round(rate * 100) + '%', note: rate >= 0.2 ? 'You kept ' + Math.round(rate * 100) + '% of your income after spending. That reaches the 20% goal.' : rate > 0 ? 'You kept ' + Math.round(rate * 100) + '% of your income after spending. The goal is 20%.' : 'You spent more than you earned in these 30 days.' });
      const dti = debtPaid / inc;
      parts.push({ k: 'Debt load', max: 25, pts: (1 - clamp((dti - 0.20) / 0.30, 0, 1)) * 25, val: Math.round(dti * 100) + '%', note: debtPaid > 0 ? 'Debt payments were ' + Math.round(dti * 100) + '% of your income. Under 20% is best.' : 'No debt payments in these 30 days.' });
    }
    const bud = BUDGET_CATS.filter(c => d.budgets[c] > 0);
    if (bud.length) { const ok = bud.filter(c => (byCat[c] || 0) <= d.budgets[c]).length; parts.push({ k: 'Budget', max: 25, pts: ok / bud.length * 25, val: ok + '/' + bud.length, note: ok + ' of ' + bud.length + ' budgets stayed within the limit.' }); }
    const ess = this.emEssentials(), have = this.emHave();
    if (ess > 0) { const mo = have / ess; parts.push({ k: 'Emergency cushion', max: 25, pts: clamp(mo / 3, 0, 1) * 25, val: (Math.round(mo * 10) / 10) + ' mo', note: 'Your emergency money covers about ' + (Math.round(mo * 10) / 10) + ' months of expenses. 3 months is the goal.' }); }
    const max = parts.reduce((a, p) => a + p.max, 0);
    return { score: max ? Math.round(parts.reduce((a, p) => a + p.pts, 0) / max * 100) : null, parts, inc };
  }
  healthScore() {
    const t = ld(), cur = this.healthScoreAt(t), prv = this.healthScoreAt(addDays(t, -30));
    let change = null;
    if (cur.score != null && prv.score != null && prv.inc > 0) {
      const diff = cur.score - prv.score, why = cur.parts.map(p => { const q = prv.parts.find(x => x.k === p.k); return q ? { k: p.k, dp: p.pts - q.pts } : null; }).filter(Boolean).filter(x => Math.abs(x.dp) >= 2).sort((a, b) => Math.abs(b.dp) - Math.abs(a.dp)).slice(0, 2);
      change = { diff, why };
    }
    cur.label = cur.score == null ? '' : cur.score < 40 ? 'Needs work' : cur.score < 60 ? 'Fair' : cur.score < 80 ? 'Good' : 'Great';
    cur.change = change; return cur;
  }
  scoreColor(s) { return s < 40 ? 'var(--bad)' : s < 60 ? 'var(--warn)' : 'var(--ok)'; }
  scoreCardHtml() {

  /* ================= Insights on Today ================= */
  insightsHtml() {
    if (!this.feat('insights')) return '';
    const d = this.data, t = ld(), cur = ymOf(new Date()), prv = addMonths(cur, -1), day = new Date().getDate();
    const real = d.expenses.filter(e => !NONSPEND.includes(e.category) && e.category !== 'Debts');
    if (new Set(real.map(e => e.date)).size < 7) return '';
    const dim = new Date(+cur.slice(0, 4), +cur.slice(5, 7), 0).getDate(), pdim = new Date(+prv.slice(0, 4), +prv.slice(5, 7), 0).getDate();
    const mtd = (k, upto) => { const o = {}; real.filter(e => e.date.startsWith(k) && +e.date.slice(8, 10) <= upto).forEach(e => { o[e.category] = (o[e.category] || 0) + e.amount; }); return o; };
    const a = mtd(cur, 31), b = mtd(prv, Math.min(day, pdim)), tot = o => Object.values(o).reduce((x, y) => x + y, 0), L = [];
    const diffs = [...new Set([...Object.keys(a), ...Object.keys(b)])].map(c => ({ c, a: a[c] || 0, b: b[c] || 0 })).filter(x => x.b >= 20 || x.a >= 20);
    const up = diffs.filter(x => x.b > 0 && x.a - x.b >= 20 && x.a / x.b >= 1.25).sort((x, y) => (y.a - y.b) - (x.a - x.b))[0];
    const dn = diffs.filter(x => x.b > 0 && x.b - x.a >= 20 && x.a / x.b <= 0.75).sort((x, y) => (y.b - y.a) - (x.b - x.a))[0];

    const top = Object.entries(a).sort((x, y) => y[1] - x[1])[0], T = tot(a);
    if (top && T > 0 && !L.length) L.push(['🥇', `${CAT_NAME[top[0]] || top[0]} is your biggest spending this month: ${Math.round(top[1] / T * 100)}% (${usd(top[1])}).`]);
    if (day >= 5 && T > 0) { const proj = r2(T / day * dim), last = tot(mtd(prv, 31)); L.push(['🧭', `At this pace you'll spend about ${usd(proj)} this month${last > 0 ? ` (last month: ${usd(last)})` : ''}.`]); }
    const from = addDays(t, -55), wd = [0, 0, 0, 0, 0, 0, 0], wn = [0, 0, 0, 0, 0, 0, 0];
    real.filter(e => e.date >= from && e.date <= t).forEach(e => { wd[pd(e.date).getDay()] += e.amount; });
    for (let i = 0; i < 56; i++) wn[pd(addDays(t, -i)).getDay()]++;
    const names = ['Sundays', 'Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays'], best = wd.map((v, i) => [i, v / Math.max(1, wn[i])]).sort((x, y) => y[1] - x[1])[0];
    if (best && best[1] > 0 && L.length < 3) L.push(['📅', `You spend the most on ${names[best[0]]}: about ${usd(r2(best[1]))} on an average one.`]);
    if (!L.length) return '';
    return `<div class="card"><h2>Insights</h2><div class="list">${L.slice(0, 3).map(x => `<div class="li"><div class="ico" style="background:var(--chipbg)">${x[0]}</div><div class="mid"><div class="t" style="font-weight:700">${esc(x[1])}</div></div></div>`).join('')}</div></div>`;
  }

  pickApply() {
    const p = this.pk, l = this.pickLabel(); if (!l.ok) return;
    this.view = p.mode === 'month' ? { mode: 'month', month: p.month, from: '', to: '' } : p.mode === 'all' ? { mode: 'all', month: ymOf(new Date()), from: '', to: '' } : p.mode === 'day' ? { mode: 'day', month: p.from.slice(0, 7), from: p.from, to: p.from } : { mode: 'range', month: p.from.slice(0, 7), from: p.from, to: p.to };
    this.closeSheet(); this.renderAll();
  }

  /* ---------- export / import ---------- */
  download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  exportJSON() { this.download('money-desk-backup-' + ld() + '.json', JSON.stringify(this.data, null, 2), 'application/json'); this.toast('Backup downloaded'); }
  exportCSV(all) {
    const q = v => { let t = String(v == null ? '' : v); if (typeof v === 'string' && /^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
    const rows = [['Date', 'Type', 'Category', 'Note', 'Account', 'Amount USD', 'Rupees paid']];
    this.data.expenses.filter(e => all === true || this.inPeriod(e.date)).forEach(e => rows.push([e.date, 'Expense', CAT_NAME[e.category] || e.category, e.note, e.cardName, e.amount, e.inrAmount == null ? '' : e.inrAmount]));
    this.data.income.filter(i => all === true || this.inPeriod(i.date)).forEach(i => rows.push([i.date, 'Income', 'Income', i.source, (this.data.cards.find(c => c.id === i.targetCardId) || {}).name || '', i.amount, '']));
    rows.sort((a, b) => (a[0] === 'Date' ? -1 : b[0] === 'Date' ? 1 : b[0].localeCompare(a[0])));
    this.download('money-desk-' + ld() + '.csv', rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv'); this.toast('CSV downloaded');
  }
  importJSON(inp) {
    const f = inp.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result); if (!j || typeof j !== 'object' || !(Array.isArray(j.expenses) || Array.isArray(j.cards) || Array.isArray(j.debts))) throw new Error('bad');
        const { data } = mergeData(this.data, Object.assign({}, j, { savedAt: 0 })); this.data = data; this.rebuildSigs(); this.stamp(); this.persistLocal(); this.renderAll(); this.queueServer();
        this.toast('Imported. Entries were merged with what you already have.');
      } catch (e) { this.toast('That file is not a Money Desk backup.'); }
      inp.value = '';
    };
    rd.readAsText(f);
  }
  install() { if (this.installEvt) { this.installEvt.prompt(); this.installEvt = null; } }
  syncNow() { this.toast('Syncing…'); this.conf = 0; this.syncFromServer(); }
  wipe() { this.confirm2('This erases all accounts, entries and debts on this device and in the saved file. Export a backup first if unsure.', () => { this.data = normalize(DEFAULT()); this.data.savedAt = Date.now(); this.rebuildSigs(); this.persistLocal(); this.renderAll(); this.queueServer(); }); }
}

let app;
app = new App();
app.initSwipe();
</script>
