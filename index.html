    const old = id ? this.data.bills.find(b => b.id === id) : null;
    const b = Object.assign(old || { id: uid('bill'), paidMonths: [], dismissedMonths: [], created: ymOf(new Date()), createdDate: ld() }, { name, kind: $('b-kind').value, amount, currency: $('b-cur') && $('b-cur').value === 'INR' ? 'INR' : 'USD', dueDay: Math.min(31, Math.max(1, Math.round(num($('b-day').value)) || 1)), warnDays: Math.max(0, Math.min(14, Math.round(num($('b-warn').value)) || 0)) });
    if (!old) this.data.bills.push(b); this.closeSheet(); this.save();
  }
  goalSheet(id) {
    const g = id ? this.data.goals.find(x => x.id === id) : null;
    this.openSheet(g ? 'Edit goal' : 'New savings goal', `<div class="fg"><label class="f">Goal<input id="g-name" type="text" maxlength="40" value="${esc(g ? g.name : '')}" placeholder="Vacation, Car repair"></label>
      <div class="two"><label class="f">Target<input id="g-t" type="number" inputmode="decimal" min="0" value="${g ? g.target : ''}"></label><label class="f">Saved so far<input id="g-s" type="number" inputmode="decimal" min="0" value="${g ? g.saved : ''}"></label></div>
      <button class="btn dark wide" onclick="app.saveGoal('${g ? g.id : ''}')">Save</button>${g ? `<button class="btn light wide" onclick="app.closeSheet();app.del('goals','${g.id}')">Delete goal</button>` : ''}</div>`);
  }
  saveGoal(id) {
    const name = $('g-name').value.trim(), target = num($('g-t').value); if (!name || target <= 0) return this.toast('Add a name and a target.');
    const old = id ? this.data.goals.find(x => x.id === id) : null;
    const g = Object.assign(old || { id: uid('goal') }, { name, target, saved: num($('g-s').value) });
    if (!old) this.data.goals.push(g); this.closeSheet(); this.save();
  }
  addSavings(id) {
    const g = this.data.goals.find(x => x.id === id); if (!g) return;
    this.openSheet('Add to ' + g.name, `<div class="fg"><label class="f">Amount<input id="s-amt" type="number" inputmode="decimal" step="0.01" min="0"></label><label class="f">Take it from (optional)<select id="s-acct">${this.cardOpts('', c => c.type !== 'credit' && c.type !== 'india' && c.type !== 'savings')}<option value="" selected>Just track it</option></select></label><button class="btn dark wide" onclick="app.doSavings('${id}')">Add</button></div>`);
  }
  doSavings(id) {
    const g = this.data.goals.find(x => x.id === id), a = r2(num($('s-amt').value)); if (!g || a <= 0) return this.toast('Enter an amount.');
    g.saved = r2(g.saved + a); const c = this.data.cards.find(x => x.id === $('s-acct').value); if (c) c.balance = r2(c.balance - a);
    this.closeSheet(); this.save(); this.toast('Added ' + usd(a) + ' to ' + g.name);
  }
  budgetSheet() {
    this.openSheet('Monthly budgets', `<p class="note">Leave blank for no budget. You get an amber warning at 80% and red when over.</p><div class="fg">${BUDGET_CATS.map(c => `<label class="f">${esc(CAT_NAME[c])}<input data-b="${c}" type="number" inputmode="decimal" min="0" value="${this.data.budgets[c] || ''}"></label>${this.feat('rollover') ? `<label class="f" style="flex-direction:row;align-items:center;gap:8px;margin-top:-6px"><input type="checkbox" data-ro="${c}" ${((this.data.settings.rollover || {})[c]) ? 'checked' : ''} style="width:auto"><span class="note" style="margin:0">Carry what is left over to next month</span></label>` : ''}`).join('')}<button class="btn dark wide" onclick="app.saveBudgets()">Save budgets</button></div>`);
  }
  saveBudgets() { document.querySelectorAll('[data-b]').forEach(i => { const v = num(i.value); if (v > 0) this.data.budgets[i.dataset.b] = v; else delete this.data.budgets[i.dataset.b]; }); if (document.querySelector('[data-ro]')) { const ro = {}; document.querySelectorAll('[data-ro]').forEach(i => { if (i.checked) ro[i.dataset.ro] = true; }); this.data.settings.rollover = ro; } this.closeSheet(); this.save(); }
  shortcutSheet() {
    const s = this.data.settings.shortcuts, rows = []; for (let i = 0; i < 6; i++) rows.push(s[i] || { cat: 'Food', amt: '', note: '' });
    this.openSheet('Quick-add shortcuts', `<p class="note">Leave the name empty to remove a shortcut.</p><div class="fg">${rows.map((r, i) => `<div class="two"><label class="f">Name<input data-sn="${i}" value="${esc(r.note)}" maxlength="24"></label><label class="f">Amount<input data-sa="${i}" type="number" inputmode="decimal" value="${r.amt}"></label><label class="f" style="grid-column:1/-1">Category<select data-sc="${i}">${this.opts(CATS, r.cat)}</select></label></div>`).join('')}<button class="btn dark wide" onclick="app.saveShortcuts()">Save</button></div>`);
  }
  saveShortcuts() {
    const out = []; for (let i = 0; i < 6; i++) { const n = document.querySelector(`[data-sn="${i}"]`).value.trim(), a = num(document.querySelector(`[data-sa="${i}"]`).value); if (n && a > 0) out.push({ note: n, amt: a, cat: document.querySelector(`[data-sc="${i}"]`).value }); }
    this.data.settings.shortcuts = out; this.closeSheet(); this.save();
  }
  setSetting(k, v) { this.data.settings[k] = v; this.save(); }

  /* ---------- delete with undo ---------- */
  delCore(col, id, keep) {
    const d = this.data, it = d[col].find(x => x.id === id); if (!it) return false;
    if (this.histDel) this.histDel(col, it, !!keep);
    if (keep) { /* remove the record only, leave balances alone */ }
    else if (col === 'expenses') {
      this.fx(it, -1);
      if (it.payFor) { const o = d.expenses.find(x => x.id === it.payFor); if (o) o.paidBack = Math.max(0, r2((o.paidBack || 0) - it.amount)); }
      if (it.dueRef && !d.expenses.some(o => o.id !== it.id && o.dueRef && o.dueRef.type === it.dueRef.type && o.dueRef.id === it.dueRef.id && o.dueRef.key === it.dueRef.key)) { const x = (it.dueRef.type === 'bill' ? d.bills : d.debts).find(i => i.id === it.dueRef.id); if (x) x.paidMonths = x.paidMonths.filter(k => k !== it.dueRef.key); }
    } else if (col === 'income') {
      this.fxIncome(it, -1);
      if (it.workIds) it.workIds.forEach(wid => { const w = d.work.find(x => x.id === wid); if (w) { w.paid = false; delete w.incomeId; } });
      if (it.recRef) { const rr = d.recurring.find(x => x.id === it.recRef.id); if (rr) rr.done = (rr.done || []).filter(x => x !== it.recRef.date); }
    }
    d[col] = d[col].filter(x => x.id !== id); d.deleted[id] = Date.now(); return true;
  }

  del(col, id, keep) {
    const snap = JSON.parse(JSON.stringify(this.data)); if (!this.delCore(col, id, keep)) return;
    this.undoSnap = { snap }; this.save(); this.toast('Deleted', true);
  }
  delBoth(id) {
    const d = this.data, it = d.expenses.find(e => e.id === id); if (!it || !it.splitId) return this.del('expenses', id);
    const ids = d.expenses.filter(e => e.splitId === it.splitId).map(e => e.id), snap = JSON.parse(JSON.stringify(d));
    ids.forEach(x => this.delCore('expenses', x)); this.undoSnap = { snap }; this.save(); this.toast('Deleted both parts', true);
  }
  delAsk(col, id) {
    const d = this.data, it = d[col].find(x => x.id === id); if (!it) return;
    const card = d.cards.find(c => c.id === (col === 'expenses' ? it.cardId : it.targetCardId)), lt = it.linkedDebtId || '', lk = lt.startsWith('debt_') ? d.debts.find(x => x.id === lt.slice(5)) : lt.startsWith('card_') ? d.cards.find(x => x.id === lt.slice(5)) : null;
    const rev = col === 'income' ? (card ? `${usd(it.amount)} is taken back out of ${card.name}.` : 'It is taken out of your totals.')
      : [card ? `The money goes back to ${card.name}.` : '', lk ? `${lk.name} goes back up.` : '', it.dueRef ? 'The monthly bill is un-ticked.' : ''].filter(Boolean).join(' ') || 'It is removed from your totals.';
    this.openSheet('Delete this entry?', `<p><b>Reverse:</b> ${esc(rev)}</p><p class="note"><b>Record only:</b> the entry disappears from the list, but your accounts and debts stay exactly as they are now.</p><div class="fg"><button class="btn danger wide" onclick="app.closeSheet();app.del('${col}','${id}')">Delete and reverse</button>${col === 'expenses' && it.splitId && d.expenses.some(o => o.id !== it.id && o.splitId === it.splitId) ? `<button class="btn danger wide" onclick="app.closeSheet();app.delBoth('${id}')">Delete both parts and reverse</button>` : ''}<button class="btn light wide" onclick="app.closeSheet();app.del('${col}','${id}',true)">Delete record only</button><button class="btn light wide" onclick="app.closeSheet()">Cancel</button></div>`);
  }
  swHidden() { try { const o = JSON.parse(localStorage.getItem('mmd_hide') || '{}'); return o.d === ld() ? o.ids || [] : []; } catch (e) { return []; } }
  sw(id, html) { if (!html) return ''; if (this.swHidden().includes(id)) { this.swCount = (this.swCount || 0) + 1; return ''; } return `<div class="sw" data-sw="${id}">${html}</div>`; }
  swHide(id) { try { const ids = this.swHidden(); if (!ids.includes(id)) ids.push(id); localStorage.setItem('mmd_hide', JSON.stringify({ d: ld(), ids })); } catch (e) {} this.renderAll(); }
  swReset() { try { localStorage.removeItem('mmd_hide'); } catch (e) {} this.renderAll(); }
  initSwipe() {
    let el = null, x0 = 0, y0 = 0, dx = 0, lock = null;
    document.addEventListener('pointerdown', e => { const t = e.target.closest && e.target.closest('.sw'); if (!t || e.target.closest('button,a,input,select')) return; el = t; x0 = e.clientX; y0 = e.clientY; dx = 0; lock = null; t.style.transition = ''; });
    document.addEventListener('pointermove', e => { if (!el) return; const mx = e.clientX - x0, my = e.clientY - y0; if (lock === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(mx) > Math.abs(my) * 1.2 ? 'x' : 'y'; if (lock === 'x') { dx = mx; el.style.transform = `translateX(${dx}px)`; el.style.opacity = String(Math.max(0.2, 1 - Math.abs(dx) / 260)); } });
    const end = () => { if (!el) return; const t = el; el = null; if (lock === 'x' && Math.abs(dx) > 90) { t.style.transition = 'transform .2s, opacity .2s'; t.style.transform = `translateX(${dx > 0 ? '110%' : '-110%'})`; t.style.opacity = '0'; setTimeout(() => this.swHide(t.dataset.sw), 200); } else { t.style.transform = ''; t.style.opacity = ''; } };
    document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  }

  /* ---------- pick dates ---------- */
  pickSheet() {
    const v = this.view;
    this.pk = { mode: v.mode === 'all' ? 'all' : v.mode === 'range' ? 'range' : v.mode === 'day' ? 'day' : 'month', from: v.mode === 'month' ? '' : v.from, to: v.mode === 'month' ? '' : v.to, month: v.mode === 'month' ? v.month : v.from ? v.from.slice(0, 7) : ymOf(new Date()), cal: v.mode === 'month' ? v.month : v.from ? v.from.slice(0, 7) : ymOf(new Date()) };
    this.pickRender();
  }
  pickLabel() {
    const p = this.pk;
    if (p.mode === 'all') return { t: 'Show all time', ok: true };
    if (p.mode === 'month') return { t: 'Show ' + monthShort(p.month), ok: true };
    if (p.mode === 'day') return p.from ? { t: 'Show ' + shortDate(p.from), ok: true } : { t: 'Pick a day', ok: false };
    return p.from && p.to ? { t: 'Show ' + shortDate(p.from) + ' – ' + shortDate(p.to), ok: true } : { t: p.from ? 'Now pick the end date' : 'Pick the start date', ok: false };
  }
  pickRender() {
    const p = this.pk, today = ld(), lbl = this.pickLabel();
    const [y, m] = p.cal.split('-').map(Number), first = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate();
    const spendDays = new Set(this.data.expenses.filter(e => e.date.startsWith(p.cal)).map(e => e.date));
    let cells = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(w => `<div class="wd">${w}</div>`).join('') + '<div class="blank"></div>'.repeat(first);
    for (let dd = 1; dd <= dim; dd++) {
      const ds = p.cal + '-' + pad(dd), fut = ds > today;
      const isEnd = ds === p.from || ds === p.to, inR = p.mode === 'range' && p.from && p.to && ds > p.from && ds < p.to;
      cells += `<button class="${isEnd ? 'end' : inR ? 'in' : ''} ${ds === today ? 'today' : ''}" ${fut ? 'disabled style="opacity:.35"' : ''} onclick="app.pickDay('${ds}')"><span>${dd}</span><i class="${spendDays.has(ds) ? 'on' : ''}"></i></button>`;
    }
    const months = this.monthsAvail().slice().reverse();
    const seg = [['day', 'Day'], ['month', 'Month'], ['range', 'Custom range']];
    const html = `<div class="seg">${seg.map(([k, n]) => `<button class="${p.mode === k ? 'on' : ''}" onclick="app.pk.mode='${k}';app.pickRender()">${n}</button>`).join('')}</div>
      <div class="btns" style="overflow-x:auto"><button class="btn light sm" onclick="app.pickQuick('7')">Last 7 days</button><button class="btn light sm" onclick="app.pickQuick('lm')">Last month</button><button class="btn light sm" onclick="app.pickQuick('yr')">This year</button><button class="btn light sm" onclick="app.pickQuick('all')">All time</button></div>
      ${p.mode === 'month' ? `<div class="list" style="max-height:300px;overflow-y:auto">${months.map(k => `<button class="pick ${k === p.month ? 'last' : ''}" onclick="app.pk.month='${k}';app.pickRender()"><b>${monthName(k)}</b>${k === p.month ? '<span class="pill s-ok">✓</span>' : ''}</button>`).join('')}</div>` :
      p.mode === 'all' ? '<div class="empty">Showing every entry you have ever saved.</div>' :
      `<div class="card soft" style="padding:10px"><div class="period-row"><button class="icon-btn flat" aria-label="Previous month" onclick="app.pk.cal=addMonths(app.pk.cal,-1);app.pickRender()">‹</button><div class="period-label">${monthName(p.cal)}</div><button class="icon-btn flat" aria-label="Next month" ${p.cal >= ymOf(new Date()) ? 'disabled style="opacity:.3"' : ''} onclick="app.pk.cal=addMonths(app.pk.cal,1);app.pickRender()">›</button></div><div class="cal">${cells}</div><div class="note"><b style="color:var(--pink)">•</b> days with spending</div></div>`}
      <button class="btn purple wide" ${lbl.ok ? '' : 'disabled style="opacity:.5"'} onclick="app.pickApply()">${esc(lbl.t)}</button>`;
    this.openSheet('Pick dates', html);
  }
  pickDay(ds) {
    const p = this.pk;
    if (p.mode === 'day') { p.from = ds; p.to = ds; }
    else if (!p.from || p.to) { p.from = ds; p.to = ''; }
    else if (ds < p.from) { p.to = p.from; p.from = ds; } else p.to = ds;
    this.pickRender();
  }
  pickQuick(k) {
    const p = this.pk, t = ld(), cur = ymOf(new Date());
    if (k === '7') { p.mode = 'range'; p.from = addDays(t, -6); p.to = t; p.cal = p.from.slice(0, 7); }
    else if (k === 'lm') { p.mode = 'month'; p.month = addMonths(cur, -1); }
    else if (k === 'yr') { p.mode = 'range'; p.from = new Date().getFullYear() + '-01-01'; p.to = t; p.cal = p.from.slice(0, 7); }
    else p.mode = 'all';
    this.pickRender();
  }
  pickApply() {
    const p = this.pk, l = this.pickLabel(); if (!l.ok) return;
    this.view = p.mode === 'month' ? { mode: 'month', month: p.month, from: '', to: '' } : p.mode === 'all' ? { mode: 'all', month: ymOf(new Date()), from: '', to: '' } : p.mode === 'day' ? { mode: 'day', month: p.from.slice(0, 7), from: p.from, to: p.from } : { mode: 'range', month: p.from.slice(0, 7), from: p.from, to: p.to };
    this.closeSheet(); this.renderAll();
  }

  /* ---------- export / import ---------- */
  download(name, text, type) { if (window.NATIVE) { NV.shareText(name, text).catch(e => { if (!/cancel|dismiss/i.test(String(e && (e.message || e)))) this.toast('Could not share the file.'); }); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  exportJSON() { try { localStorage.setItem('mmd_lastbk', String(Date.now())); } catch (e) {} this.download('money-desk-backup-' + ld() + '.json', JSON.stringify(this.data, null, 2), 'application/json'); this.toast(window.NATIVE ? 'Choose where to save the backup' : 'Backup downloaded'); }
  exportCSV(all) {
    const q = v => { let t = String(v == null ? '' : v); if (typeof v === 'string' && /^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
    const rows = [['Date', 'Type', 'Category', 'Note', 'Account', 'Amount USD', 'Rupees paid']];
    this.data.expenses.filter(e => all === true || this.inPeriod(e.date)).forEach(e => rows.push([e.date, 'Expense', CAT_NAME[e.category] || e.category, e.note, e.cardName, e.amount, e.inrAmount == null ? '' : e.inrAmount]));
    this.data.income.filter(i => all === true || this.inPeriod(i.date)).forEach(i => rows.push([i.date, 'Income', 'Income', i.source, (this.data.cards.find(c => c.id === i.targetCardId) || {}).name || '', i.amount, '']));
    rows.sort((a, b) => (a[0] === 'Date' ? -1 : b[0] === 'Date' ? 1 : b[0].localeCompare(a[0])));
    this.download('money-desk-' + ld() + '.csv', rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv'); this.toast(window.NATIVE ? 'Choose where to save the CSV' : 'CSV downloaded');
  }
  importJSON(inp) {
    const f = inp.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => {
      if (this.lockedImport && this.lockedImport(rd.result)) { inp.value = ''; return; }
      try {
        const j = JSON.parse(rd.result); if (!j || typeof j !== 'object' || !(Array.isArray(j.expenses) || Array.isArray(j.cards) || Array.isArray(j.debts))) throw new Error('bad');
        this.importMerge(j);
      } catch (e) { this.toast('That file is not a Money Desk backup.'); }
      inp.value = '';
    };
    rd.readAsText(f);
  }
  importMerge(j) { const { data } = mergeData(this.data, Object.assign({}, j, { savedAt: 0 })); this.data = data; this.rebuildSigs(); this.stamp(); this.persistLocal(); this.renderAll(); this.queueServer(); this.toast('Imported. Entries were merged with what you already have.'); }
  install() { if (this.installEvt) { this.installEvt.prompt(); this.installEvt = null; } }
  syncNow() { this.toast('Syncing…'); this.conf = 0; this.syncFromServer(); }
  wipe() { this.confirm2('This erases all accounts, entries and debts on this device and in the saved file. Export a backup first if unsure.', () => { this.data = normalize(DEFAULT()); this.data.savedAt = Date.now(); this.rebuildSigs(); this.persistLocal(); this.renderAll(); this.queueServer(); }); }
}

let app;
app = new App();
app.initSwipe();
</script>
</body>
